name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: types, unit, integration
    runs-on: ubuntu-latest
    env:
      # Unit tests are pure; integration tests override this with their own
      # test.db. A value is set so Prisma Client construction is happy.
      DATABASE_URL: "file:./prisma/ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration

  postgres:
    name: integration on postgres
    runs-on: ubuntu-latest
    # Production runs Postgres; local dev, the integration suite and e2e all
    # run SQLite, which SERIALIZES WRITERS. Every read-then-write race this
    # codebase guards against is therefore invisible to the job above — the
    # same 367 tests only exercise the guards for real here. See CLAUDE.md,
    # "Concurrency: the two rules".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ld2l_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: "postgresql://postgres:postgres@localhost:5432/ld2l_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
      - run: npm ci
      # The committed schema is on sqlite; production's build does this same
      # swap. Nothing is committed back — it lives only in this runner.
      - name: Point Prisma at postgres
        run: node scripts/switch-db-provider.mjs postgresql
      - name: Push the schema + generate the client
        run: npx prisma db push --skip-generate --accept-data-loss && npx prisma generate
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
      - name: Integration tests on postgres
        run: npm run test:pg

      # THE RATCHET. A guarded claim's WHERE predicate is its entire
      # concurrency guard, and almost nothing in the suite notices if one is
      # deleted — a happy-path test passes just as well against a blind write.
      # So: delete each protected guard in turn and require the suite to fail.
      # Only the claims the baseline already records as protected are
      # re-checked, which keeps this to a few suite runs rather than one per
      # claim in the repo. New unprotected claims are reported, never gating.
      - name: Mutation guard (protected claims must stay protected)
        run: node scripts/mutation-guard.mjs

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./prisma/dev.db"
      ALLOW_DEV_LOGIN: "true"
      AUTH_SECRET: "ci-secret-please-change-0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Create the dev database schema
        run: npx prisma db push --skip-generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e (seeds the DB + boots next dev)
        run: npm run test:e2e
      - name: Run mid-season e2e (fixture DB, own port)
        # Sequential on purpose — Next's project-dir lock allows one dev
        # server per repo, so the two suites can never run simultaneously.
        run: npm run test:e2e:mid

      # Without this a failure leaves only log text, which needs repo auth to
      # read — so a red e2e job could not be diagnosed by anyone looking from
      # outside. The report carries the failing test, its error, a screenshot
      # and a trace you can open in the Playwright viewer.
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
