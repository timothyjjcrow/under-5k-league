name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: audit, lint, types, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unit tests are pure; integration tests override this with their own
      # test.db. A value is set so Prisma Client construction is happy.
      # Use an absolute URL so the allowlisted clean-bootstrap helper and
      # Prisma agree on the exact CI-owned file.
      DATABASE_URL: "file:${{ github.workspace }}/prisma/ci.db"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency audit
        run: npm audit --audit-level=low
      - name: Validate committed SQLite schema
        run: npx prisma validate
      - run: npx prisma generate
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate active scheduler artifact
        run: npm run scheduler:check
      - name: Validate paused scheduler artifact
        run: npm run scheduler:check:paused
      # `github-actions` emits ANNOTATIONS naming the failing test, file, line
      # and error on the run summary — readable WITHOUT repo auth. Same reason
      # the e2e job carries Playwright's `github` reporter: a red job whose only
      # detail is buried in an authenticated log cannot be diagnosed by anyone
      # looking from outside, which is exactly how this job stayed red for
      # three commits while passing in a faithful local clean-room run.
      - name: Unit tests
        run: npm test -- --reporter=github-actions --reporter=default
      - name: Integration tests
        run: npm run test:integration -- --reporter=github-actions --reporter=default
      - name: Create build database schema
        run: node scripts/prepare-sqlite-test-db.mjs ciBuild && npx prisma db push --skip-generate
      - name: Production build
        run: npm run build

  postgres:
    name: integration on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Production runs Postgres; local dev, the integration suite and e2e all
    # run SQLite, which SERIALIZES WRITERS. Every read-then-write race this
    # codebase guards against is therefore invisible to the job above — the
    # same integration suite only exercises the guards for real here. See CLAUDE.md,
    # "Concurrency: the two rules".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # The migration rehearsal has a deliberately narrow destructive
          # guard and accepts only a local database named exactly ld2l_pgtest.
          POSTGRES_DB: ld2l_pgtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: "postgresql://postgres:postgres@localhost:5432/ld2l_pgtest"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      # The committed schema is on sqlite; production's build does this same
      # swap. Nothing is committed back — it lives only in this runner.
      - name: Point Prisma at postgres
        run: node scripts/switch-db-provider.mjs postgresql
      - name: Validate committed migrations and PostgreSQL schema
        run: npm run db:migrate:validate
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
      - name: Rehearse fresh and legacy database upgrades
        run: npm run db:migrate:rehearse
      - name: Rehearse a verified backup restore
        shell: bash
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
          PG_RESTORE_TEST_URL: "postgresql://postgres:postgres@localhost:5432/ld2l_restore_test"
          BACKUP_RECEIPT_SECRET: "R7vN2cQ9mK4xT8pL1hD6sW3yF5bJ0zUa"
        run: |
          set -euo pipefail
          export BACKUP_DIR="${RUNNER_TEMP}/ld2l-backup-rehearsal"
          npm run db:backup
          backup_file="$(find "${BACKUP_DIR}" -maxdepth 1 -type f -name 'backup-*.sql' -print -quit)"
          test -n "${backup_file}"
          npm run db:backup:verify -- "${backup_file}"
          npm run db:backup:rehearse -- "${backup_file}"
          fixture_counts="$(
            PGHOST=localhost \
            PGPORT=5432 \
            PGUSER=postgres \
            PGPASSWORD=postgres \
            PGDATABASE=ld2l_restore_test \
            psql -X --set=ON_ERROR_STOP=on --tuples-only --no-align \
              --command="SELECT (SELECT COUNT(*) FROM \"User\" WHERE \"id\" = 'legacy-user-a'), (SELECT COUNT(*) FROM \"Season\" WHERE \"id\" = 'legacy-season')"
          )"
          test "${fixture_counts}" = "1|1"
      - name: Rehearse a verified legacy backup baseline upgrade
        shell: bash
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
          PG_RESTORE_TEST_URL: "postgresql://postgres:postgres@localhost:5432/ld2l_restore_test"
        run: |
          set -euo pipefail
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres \
            PGDATABASE=ld2l_pgtest psql -X --set=ON_ERROR_STOP=on \
            --command='DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO CURRENT_USER; GRANT ALL ON SCHEMA public TO public;'
          npx prisma db execute \
            --file prisma/migrations/20260804000000_baseline/migration.sql \
            --schema prisma/schema.prisma
          PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres \
            PGDATABASE=ld2l_pgtest psql -X --set=ON_ERROR_STOP=on \
            --command="INSERT INTO \"User\" (\"id\", \"steamId\", \"name\", \"updatedAt\") VALUES ('legacy-restore-user', '76561198000000001', 'Legacy Restore', CURRENT_TIMESTAMP); INSERT INTO \"Season\" (\"id\", \"name\", \"isActive\", \"updatedAt\") VALUES ('legacy-restore-season', 'Legacy Restore Season', true, CURRENT_TIMESTAMP);"
          export BACKUP_DIR="${RUNNER_TEMP}/ld2l-legacy-backup-rehearsal"
          npm run db:backup
          backup_file="$(find "${BACKUP_DIR}" -maxdepth 1 -type f -name 'backup-*.sql' -print -quit)"
          test -n "${backup_file}"
          npm run db:backup:rehearse -- --legacy-baseline "${backup_file}"
          restored_counts="$(
            PGHOST=localhost \
            PGPORT=5432 \
            PGUSER=postgres \
            PGPASSWORD=postgres \
            PGDATABASE=ld2l_restore_test \
            psql -X --set=ON_ERROR_STOP=on --tuples-only --no-align \
              --command="SELECT (SELECT COUNT(*) FROM \"User\" WHERE \"id\" = 'legacy-restore-user'), (SELECT COUNT(*) FROM \"Season\" WHERE \"id\" = 'legacy-restore-season'), (SELECT COUNT(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL)"
          )"
          test "${restored_counts}" = "1|1|3"
          npm run pg:up
      - name: Generate the migrated PostgreSQL client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
      - name: Integration tests on postgres
        run: npm run test:pg -- --reporter=github-actions --reporter=default
      - name: Exercise the exact Vercel migration and build pipeline
        run: npm run build:vercel
        # Deliberately synthetic values that satisfy production validation;
        # this job targets only the disposable Postgres service. Rehearsal left
        # the schema current, so `migrate deploy` is a no-op while still proving
        # that the canonical production command executes before generation and
        # compilation.
        env:
          VERCEL_ENV: production
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
          AUTH_SECRET: "C8kP2vR7xM4qT9wL6nH3dF5sJ0yB1zUa"
          CRON_SECRET: "N6pT2yK8mW4cR9hL1sD7vF3xB5qJ0zUa"
          BACKUP_RECEIPT_SECRET: "G9mW4rK2pX8cN6tV1hD7sQ3yL5bJ0fZa"
          STEAM_API_KEY: "0123456789ABCDEF0123456789ABCDEF"
          ADMIN_STEAM_IDS: "76561198000000001"
          APP_URL: "https://ci.ld2l.invalid"
          NEXT_PUBLIC_SITE_URL: "https://ci.ld2l.invalid"
          PRIVACY_CONTACT_EMAIL: "privacy-ci@ggd2l.org"
          PRIVACY_DATA_LOCATIONS: "United States"
          ALLOW_DEV_LOGIN: "false"

  # THE RATCHET, sharded. A guarded claim's WHERE predicate is its entire
  # concurrency guard, and almost nothing in the suite notices if one is
  # deleted — a happy-path test passes just as well against a blind write. So:
  # delete each protected guard in turn and require the suite to fail.
  #
  # Every mutant costs a full suite run, so this grows LINEARLY with coverage.
  # The committed closed inventory is the ratchet; the shards are a disjoint,
  # complete partition of that inventory, so coverage per push is
  # unchanged; only the wall clock moves. Raise `shard` if it creeps up again.
  # Any unclassified live claim or stale classification fails preflight.
  mutation:
    name: mutation guard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # one bad shard shouldn't hide the others' results
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ld2l_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: "postgresql://postgres:postgres@localhost:5432/ld2l_test"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - name: Point Prisma at postgres
        run: node scripts/switch-db-provider.mjs postgresql
      - name: Validate committed migrations and PostgreSQL schema
        run: npm run db:migrate:validate
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
      - name: Preflight + deploy + attest migrations + generate the client
        run: npm run db:migrate:preflight && npx prisma migrate deploy && npm run db:migrate:postflight && npx prisma generate
        env:
          DATABASE_URL: ${{ env.PG_TEST_URL }}
          DIRECT_URL: ${{ env.PG_TEST_URL }}
      - name: Verify this shard's protected claims
        run: node scripts/mutation-guard.mjs --shard ${{ matrix.shard }}/4

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: "file:./dev.db"
      ALLOW_DEV_LOGIN: "true"
      AUTH_SECRET: "ci-secret-please-change-0123456789abcdef"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e (seeds the DB + boots next dev)
        run: npm run test:e2e
      - name: Run mid-season e2e (fixture DB, own port)
        # Sequential on purpose — Next's project-dir lock allows one dev
        # server per repo, so the suites can never run simultaneously.
        run: npm run test:e2e:mid
      - name: Run postseason e2e (fixture DB, own port)
        run: npm run test:e2e:postseason

      # Without this a failure leaves only log text, which needs repo auth to
      # read — so a red e2e job could not be diagnosed by anyone looking from
      # outside. The report carries the failing test, its error, a screenshot
      # and a trace you can open in the Playwright viewer.
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
