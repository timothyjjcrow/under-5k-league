name: Dependency audit

# The full (dev-inclusive) audit at every severity. CI blocks on any advisory
# in shipped dependencies and on high/critical ones in dev tools; this weekly
# run surfaces the remaining low/moderate dev-tool advisories without holding
# a release. It is a separate workflow on purpose: the release gate reads only
# ci.yml runs, and a scheduled run inside ci.yml would share its concurrency
# group and could cancel an in-flight push run on main.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: full dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full dependency audit
        run: npm audit --audit-level=low
