# GGD2L PostgreSQL settings (design §1.6). install-kit.sh copies this file to
# /etc/postgresql/18/main/conf.d/90-ggd2l.conf; Debian's postgresql.conf ends
# with include_dir = 'conf.d', so these values win over the packaged ones.
#
# Sized for a 1 vCPU / 2 GB box that also runs two Next servers, Caddy,
# cloudflared and the lobby bot. max_connections covers both leagues' pools
# (connection_limit=8 per process, two slots each during a release overlap)
# plus backups, drills and the agent.

listen_addresses = 'localhost'
max_connections = 50
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
# Neon runs in UTC; keep the same clock so dumps, parity and the app agree.
timezone = 'UTC'
log_timezone = 'UTC'
idle_in_transaction_session_timeout = '5min'
password_encryption = 'scram-sha-256'
# Only local TCP (127.0.0.1) and the Unix socket reach this server.
ssl = off
log_min_duration_statement = 1000
