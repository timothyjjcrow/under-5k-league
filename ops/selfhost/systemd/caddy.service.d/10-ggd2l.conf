# Caddy is the only way into both leagues: cloudflared hands every request to
# it. The caddy package's own unit has no Restart=, so if Caddy exits, both
# sites stay down until someone starts it by hand, while the tunnel
# (Restart=always) and the slots (on-failure) come back by themselves.
# install-kit.sh installs this file as
# /etc/systemd/system/caddy.service.d/10-ggd2l.conf and reloads systemd.
#
# Restart= applies from that daemon-reload on; OOMScoreAdjust= only from
# Caddy's next start (a reboot, or `systemctl restart caddy` in a quiet minute).
[Unit]
# Like the tunnel: a Caddy that gives up after a burst of fast failures takes
# both sites down, so keep retrying.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2
# Under memory pressure the kernel should kill a slot (0) or a build (600)
# long before Caddy, which holds a few tens of MB; PostgreSQL's postmaster
# (-900, from its package's unit) stays the last choice.
OOMScoreAdjust=-500
