<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="60">
<title>GGD2L is under maintenance</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #16181d; --muted: #5b6270; --card: #ffffff; --line: #dfe2e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #eef0f4; --muted: #a2a9b6; --card: #171a21; --line: #2a2f3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 32rem; padding: 28px 24px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--card); }
  .brand { margin: 0 0 4px; font-weight: 800; letter-spacing: 0.08em; font-size: 0.85rem; color: var(--muted); }
  h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.25; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }
</style>
</head>
<body>
<main>
  <p class="brand">GGD2L</p>
  <h1>The league site is under maintenance</h1>
  <p>We are moving the site to a new home or updating it. It should be back shortly.</p>
  <p>Check the league Discord for updates. When the site is back, you may need to sign in again.</p>
  <p class="muted">This page refreshes itself once a minute.</p>
</main>
</body>
</html>
